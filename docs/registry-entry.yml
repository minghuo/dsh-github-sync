url: https://github.com/minghuo/dsh-github-sync
name: minghuo/dsh-github-sync
category: session
description:
  en: 'Back up dsh sessions, plugin manifests and settings to a private GitHub repository over the REST API (no git binary), one directory per machine, and restore them — whole machine, single workspace or single session — on another machine.'
  zh: '通过纯 REST 接口把 dsh 会话、插件清单与设置备份到私有 GitHub 仓库（不需要 git 二进制），每台机器一个独立目录，并可在另一台机器上按整机、单工作区或单会话恢复。'
