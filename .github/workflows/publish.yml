# Publishes a release when a `v*` tag is pushed.
#
# Two independent halves:
#   - npm: makes `dsh plugin --profile web add dsh-github-sync` resolve, and
#     gives the plugin-market entry an npm-backed install line. Needs an
#     NPM_TOKEN repository secret (an npm automation token with publish
#     rights); without it the step is skipped rather than failing the run.
#   - GitHub Release: always created, because installing by git spec
#     (`dsh plugin --profile web add github:<owner>/dsh-github-sync`) never
#     depends on npm.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Job level on purpose: a step's `if:` can read job-level env but not its
      # own, so this is what makes the npm step conditional.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag != package.json $pkg" >&2
            exit 1
          fi

      - name: 构建并测试
        run: |
          node scripts/build-client.mjs
          git diff --exit-code -- client/bundle.js
          npm run check
          npm test

      - name: 发布到 npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 未配置 NPM_TOKEN，跳过 npm
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN 未配置 → 跳过 npm 发布；GitHub Release 照常创建，git 安装不受影响。"

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
